<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #050816;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
            radial-gradient(circle at 20% 20%, #18205a 0%, transparent 25%),
            radial-gradient(circle at 80% 70%, #30145e 0%, transparent 25%),
            #050816;
    }

    canvas {
        position: absolute;
        inset: 0;
    }

    #ui {
        position: absolute;
        top: 15px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        z-index: 5;
        font-size: 18px;
        text-shadow: 0 0 8px #000;
    }

    .stats {
        display: flex;
        gap: 25px;
    }

    #startScreen,
    #gameOverScreen {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: rgba(0, 0, 20, 0.78);
        z-index: 10;
        text-align: center;
    }

    #gameOverScreen {
        display: none;
    }

    h1 {
        font-size: 55px;
        margin: 0 0 10px;
        color: #60a5fa;
        text-shadow: 0 0 25px #2563eb;
    }

    h2 {
        font-size: 40px;
        margin: 10px;
    }

    p {
        color: #cbd5e1;
        font-size: 18px;
    }

    button {
        margin-top: 20px;
        padding: 14px 35px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(37, 99, 235, .5);
    }

    button:hover {
        background: #3b82f6;
        transform: scale(1.05);
    }

    .controls {
        margin-top: 15px;
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.8;
    }

    #mobileControls {
        display: none;
    }

    @media (max-width: 700px) {
        h1 {
            font-size: 38px;
        }

        #ui {
            font-size: 14px;
        }

        .stats {
            gap: 10px;
        }
    }
</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="ui">
        <div class="stats">
            <div>❤️ HP: <span id="health">100</span></div>
            <div>⭐ Score: <span id="score">0</span></div>
            <div>🏆 High: <span id="highScore">0</span></div>
        </div>

        <div>
            Level: <span id="level">1</span>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen">
        <h1>🚀 SPACE SHOOTER</h1>
        <p>Defend the galaxy from the incoming enemies!</p>

        <button onclick="startGame()">START GAME</button>

        <div class="controls">
            <b>Move:</b> WASD / Arrow Keys<br>
            <b>Shoot:</b> SPACE<br>
            <b>Pause:</b> P
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOverScreen">
        <h2>💥 GAME OVER</h2>

        <p>
            Score: <span id="finalScore">0</span><br>
            Level: <span id="finalLevel">1</span>
        </p>

        <button onclick="startGame()">PLAY AGAIN</button>
    </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

/* =========================
   GAME VARIABLES
========================= */

let player;
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];

let score = 0;
let highScore = Number(localStorage.getItem("spaceHighScore")) || 0;
let level = 1;

let gameRunning = false;
let paused = false;

let keys = {};

let enemyTimer = 0;
let shootCooldown = 0;


/* =========================
   UI
========================= */

const healthUI = document.getElementById("health");
const scoreUI = document.getElementById("score");
const highScoreUI = document.getElementById("highScore");
const levelUI = document.getElementById("level");

highScoreUI.textContent = highScore;


/* =========================
   INPUT
========================= */

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        keys.space = true;
        e.preventDefault();
    }

    if (e.key.toLowerCase() === "p" && gameRunning) {
        paused = !paused;
    }

});

window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

    if (e.code === "Space") {
        keys.space = false;
    }

});


/* =========================
   PLAYER
========================= */

function createPlayer() {

    return {
        x: W / 2,
        y: H - 100,
        width: 42,
        height: 55,
        speed: 6,
        health: 100,
        invincible: 0
    };

}


/* =========================
   STARS
========================= */

function createStars() {

    stars = [];

    for (let i = 0; i < 160; i++) {

        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 2 + 0.5
        });

    }

}


/* =========================
   BULLET
========================= */

function shoot() {

    if (shootCooldown > 0) return;

    bullets.push({
        x: player.x,
        y: player.y - 28,
        width: 5,
        height: 18,
        speed: 10
    });

    shootCooldown = 10;

}


/* =========================
   ENEMIES
========================= */

function spawnEnemy() {

    const type = Math.random();

    let enemy;

    if (type < 0.7) {

        enemy = {
            type: "normal",
            x: Math.random() * (W - 40) + 20,
            y: -50,
            width: 38,
            height: 38,
            speed: 2 + level * 0.15,
            health: 1,
            points: 10
        };

    } else if (type < 0.92) {

        enemy = {
            type: "fast",
            x: Math.random() * (W - 35) + 20,
            y: -50,
            width: 30,
            height: 30,
            speed: 4 + level * 0.2,
            health: 1,
            points: 20
        };

    } else {

        enemy = {
            type: "tank",
            x: Math.random() * (W - 60) + 30,
            y: -70,
            width: 60,
            height: 60,
            speed: 1.2 + level * 0.1,
            health: 4,
            points: 50
        };

    }

    enemies.push(enemy);

}


/* =========================
   PARTICLES
========================= */

function explosion(x, y, amount = 20) {

    for (let i = 0; i < amount; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;

        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 40 + Math.random() * 30,
            size: Math.random() * 4 + 1
        });

    }

}


/* =========================
   COLLISION
========================= */

function collision(a, b) {

    return (
        a.x - a.width / 2 < b.x + b.width / 2 &&
        a.x + a.width / 2 > b.x - b.width / 2 &&
        a.y - a.height / 2 < b.y + b.height / 2 &&
        a.y + a.height / 2 > b.y - b.height / 2
    );

}


/* =========================
   UPDATE
========================= */

function update() {

    if (!gameRunning || paused) return;

    /* PLAYER */

    if (
        keys.arrowleft ||
        keys.a
    ) {
        player.x -= player.speed;
    }

    if (
        keys.arrowright ||
        keys.d
    ) {
        player.x += player.speed;
    }

    if (
        keys.arrowup ||
        keys.w
    ) {
        player.y -= player.speed;
    }

    if (
        keys.arrowdown ||
        keys.s
    ) {
        player.y += player.speed;
    }

    player.x = Math.max(25, Math.min(W - 25, player.x));
    player.y = Math.max(50, Math.min(H - 30, player.y));


    /* SHOOT */

    if (keys.space) {
        shoot();
    }

    if (shootCooldown > 0) {
        shootCooldown--;
    }


    /* INVINCIBILITY */

    if (player.invincible > 0) {
        player.invincible--;
    }


    /* BULLETS */

    bullets.forEach(b => {
        b.y -= b.speed;
    });

    bullets = bullets.filter(b => b.y > -30);


    /* ENEMY SPAWNING */

    enemyTimer--;

    const spawnRate = Math.max(18, 65 - level * 3);

    if (enemyTimer <= 0) {
        spawnEnemy();
        enemyTimer = spawnRate;
    }


    /* ENEMIES */

    enemies.forEach(enemy => {

        enemy.y += enemy.speed;

        /* Enemy reaches bottom */

        if (enemy.y > H + 80) {

            enemy.health = 0;

            damagePlayer(10);
        }

        /* Enemy hits player */

        if (
            player.invincible <= 0 &&
            collision(player, enemy)
        ) {

            enemy.health = 0;

            damagePlayer(
                enemy.type === "tank" ? 25 : 15
            );

            explosion(enemy.x, enemy.y, 25);
        }

    });


    /* BULLET COLLISIONS */

    bullets.forEach(bullet => {

        enemies.forEach(enemy => {

            if (
                enemy.health > 0 &&
                collision(bullet, enemy)
            ) {

                bullet.y = -100;

                enemy.health--;

                explosion(
                    bullet.x,
                    bullet.y,
                    5
                );

                if (enemy.health <= 0) {

                    score += enemy.points;

                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem(
                            "spaceHighScore",
                            highScore
                        );
                    }

                    explosion(
                        enemy.x,
                        enemy.y,
                        enemy.type === "tank" ? 35 : 20
                    );

                    updateLevel();
                }

            }

        });

    });


    enemies = enemies.filter(e => e.health > 0);


    /* PARTICLES */

    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.98;
        p.vy *= 0.98;

        p.life--;

    });

    particles = particles.filter(p => p.life > 0);


    /* STARS */

    stars.forEach(star => {

        star.y += star.speed;

        if (star.y > H) {
            star.y = 0;
            star.x = Math.random() * W;
        }

    });


    updateUI();

}


/* =========================
   DAMAGE
========================= */

function damagePlayer(amount) {

    if (player.invincible > 0) return;

    player.health -= amount;

    player.invincible = 60;

    explosion(player.x, player.y, 15);

    if (player.health <= 0) {
        endGame();
    }

}


/* =========================
   LEVEL
========================= */

function updateLevel() {

    level = Math.floor(score / 150) + 1;

}


/* =========================
   UI UPDATE
========================= */

function updateUI() {

    healthUI.textContent = Math.max(0, player.health);
    scoreUI.textContent = score;
    highScoreUI.textContent = highScore;
    levelUI.textContent = level;

}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.clearRect(0, 0, W, H);


    /* BACKGROUND */

    ctx.fillStyle = "#050816";
    ctx.fillRect(0, 0, W, H);


    /* STARS */

    stars.forEach(star => {

        ctx.fillStyle = "white";

        ctx.globalAlpha = Math.random() * 0.5 + 0.5;

        ctx.beginPath();
        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });

    ctx.globalAlpha = 1;


    /* PLAYER */

    if (
        player &&
        (
            player.invincible === 0 ||
            Math.floor(player.invincible / 5) % 2 === 0
        )
    ) {

        ctx.save();

        ctx.translate(player.x, player.y);

        /* Engine flame */

        ctx.fillStyle = "#f97316";

        ctx.beginPath();

        ctx.moveTo(-8, 25);
        ctx.lineTo(0, 42 + Math.random() * 10);
        ctx.lineTo(8, 25);

        ctx.closePath();
        ctx.fill();


        /* Ship */

        ctx.fillStyle = "#38bdf8";

        ctx.beginPath();

        ctx.moveTo(0, -30);
        ctx.lineTo(-22, 25);
        ctx.lineTo(0, 17);
        ctx.lineTo(22, 25);

        ctx.closePath();
        ctx.fill();


        /* Cockpit */

        ctx.fillStyle = "#e0f2fe";

        ctx.beginPath();
        ctx.arc(0, -8, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

    }


    /* BULLETS */

    bullets.forEach(b => {

        ctx.fillStyle = "#facc15";

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#facc15";

        ctx.fillRect(
            b.x - b.width / 2,
            b.y,
            b.width,
            b.height
        );

        ctx.shadowBlur = 0;

    });


    /* ENEMIES */

    enemies.forEach(enemy => {

        ctx.save();

        ctx.translate(enemy.x, enemy.y);

        if (enemy.type === "normal") {

            ctx.fillStyle = "#ef4444";

            ctx.beginPath();

            ctx.moveTo(0, 25);
            ctx.lineTo(-22, -15);
            ctx.lineTo(0, -25);
            ctx.lineTo(22, -15);

            ctx.closePath();
            ctx.fill();

        }

        else if (enemy.type === "fast") {

            ctx.fillStyle = "#a855f7";

            ctx.beginPath();

            ctx.moveTo(0, 20);
            ctx.lineTo(-14, -20);
            ctx.lineTo(0, -10);
            ctx.lineTo(14, -20);

            ctx.closePath();
            ctx.fill();

        }

        else {

            ctx.fillStyle = "#f97316";

            ctx.fillRect(
                -30,
                -30,
                60,
                60
            );

            ctx.fillStyle = "#7c2d12";

            ctx.fillRect(
                -12,
                -12,
                24,
                24
            );

        }

        ctx.restore();

    });


    /* PARTICLES */

    particles.forEach(p => {

        ctx.globalAlpha = p.life / 70;

        ctx.fillStyle = "#fbbf24";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });

    ctx.globalAlpha = 1;


    /* PAUSE */

    if (paused && gameRunning) {

        ctx.fillStyle = "rgba(0,0,0,.55)";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "white";
        ctx.font = "50px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            "⏸ PAUSED",
            W / 2,
            H / 2
        );

    }

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);

}


/* =========================
   START GAME
========================= */

function startGame() {

    player = createPlayer();

    bullets = [];
    enemies = [];
    particles = [];

    score = 0;
    level = 1;

    enemyTimer = 0;
    shootCooldown = 0;

    paused = false;
    gameRunning = true;

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameOverScreen").style.display = "none";

    createStars();

    updateUI();

}


/* =========================
   END GAME
========================= */

function endGame() {

    gameRunning = false;

    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalLevel").textContent = level;

    document.getElementById("gameOverScreen").style.display = "flex";

}


/* =========================
   START LOOP
========================= */

createStars();
gameLoop();

</script>

</body>
</html>
