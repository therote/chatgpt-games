<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Box Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        .info {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 20px;
            margin: 20px;
        }

        #game {
            width: 90%;
            max-width: 700px;
            height: 450px;
            margin: auto;
            background: #1f2937;
            border: 3px solid #374151;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        #box {
            width: 50px;
            height: 50px;
            background: #ef4444;
            border-radius: 10px;
            position: absolute;
            cursor: pointer;
            display: none;
        }

        #startBtn {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            cursor: pointer;
        }

        #startBtn:hover {
            background: #16a34a;
        }

        #message {
            font-size: 22px;
            margin: 15px;
        }
    </style>
</head>

<body>

    <h1>🎯 Catch the Box</h1>

    <div class="info">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">30</span>s</div>
    </div>

    <button id="startBtn">Start Game</button>

    <div id="message">Click Start to begin!</div>

    <div id="game">
        <div id="box"></div>
    </div>

    <script>
        const box = document.getElementById("box");
        const game = document.getElementById("game");
        const scoreText = document.getElementById("score");
        const timeText = document.getElementById("time");
        const startBtn = document.getElementById("startBtn");
        const message = document.getElementById("message");

        let score = 0;
        let time = 30;
        let timer;
        let playing = false;

        function moveBox() {
            const maxX = game.clientWidth - box.offsetWidth;
            const maxY = game.clientHeight - box.offsetHeight;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            box.style.left = x + "px";
            box.style.top = y + "px";
        }

        function startGame() {
            score = 0;
            time = 30;
            playing = true;

            scoreText.textContent = score;
            timeText.textContent = time;

            box.style.display = "block";
            startBtn.disabled = true;
            message.textContent = "Click the red box!";

            moveBox();

            timer = setInterval(() => {
                time--;
                timeText.textContent = time;

                if (time <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(timer);
            playing = false;

            box.style.display = "none";
            startBtn.disabled = false;

            message.textContent = "🎉 Game Over! Your score: " + score;
        }

        box.addEventListener("click", () => {
            if (!playing) return;

            score++;
            scoreText.textContent = score;

            moveBox();
        });

        startBtn.addEventListener("click", startGame);
    </script>

</body>
</html>
